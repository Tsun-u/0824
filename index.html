<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一封密信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--card:#1a1a1a;--text:#d4c5a9;--accent:#c8956c;
  --border:#3a3028;--hint:#8a7a60;--input-bg:#111;--input-border:#4a3a28;
}
body{
  background:var(--bg);color:var(--text);font-family:"Georgia","Times New Roman",serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.envelope{
  max-width:600px;width:100%;background:var(--card);
  border:1px solid var(--border);border-radius:4px;
  padding:40px 32px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.envelope::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.seal{
  width:60px;height:60px;margin:0 auto 24px;
  border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:0 4px 12px rgba(200,149,108,0.3);
}
h1{
  text-align:center;font-size:1.3em;font-weight:normal;
  letter-spacing:0.1em;margin-bottom:24px;color:var(--accent);
}
.divider{
  width:60px;height:1px;background:var(--border);margin:20px auto;
}
.cipher-block{
  background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:4px;padding:16px;margin:20px 0;
  font-family:"Courier New",monospace;font-size:0.85em;
  word-break:break-all;line-height:1.6;color:var(--hint);
  text-align:center;user-select:all;cursor:text;
}
.hint{
  font-size:0.9em;line-height:1.8;color:var(--hint);
  text-align:center;margin:20px 0;font-style:italic;
}
.hint strong{color:var(--text)}
.tools{
  margin:24px 0;text-align:center;
}
.tools a{
  display:inline-block;margin:6px 8px;padding:8px 18px;
  border:1px solid var(--accent);border-radius:4px;
  color:var(--accent);text-decoration:none;font-size:0.85em;
  transition:all 0.3s;letter-spacing:0.03em;
}
.tools a:hover{background:var(--accent);color:var(--bg)}
.note{
  text-align:center;font-size:0.8em;color:#555;margin-top:24px;
  line-height:1.6;
}
.footer{
  text-align:center;font-size:0.75em;color:#444;margin-top:32px;
  letter-spacing:0.05em;
}
</style>
</head>
<body>
<div class="envelope">
  <div class="seal">🔐</div>
  <h1>一封密信</h1>
  <div class="divider"></div>
  <p class="hint">
    這段文字被鎖住了。<br>
    打開它需要一把鑰匙。
  </p>
  <div class="cipher-block">dHN1bnU4MjRiaXJ0aGRheWXdQ9EZtuQNE903tctWWrUokClTvHiUW331md0KA0P8Lki3IRTDHkgBezDKfwdIxw==</div>
  <p class="hint">
    鑰匙藏在他的生活裡——<br>
    <strong>一個日期</strong>、<strong>兩個名字</strong>、<strong>一間公司</strong>。<br><br>
    把它們按順序串起來，<br>
    然後用 <strong>MD5</strong> 鑄成鑰匙。
  </p>
  <div class="divider"></div>
  <p class="hint">
    解開之後，你會得到一個<strong>網址</strong>。
  </p>
  <div class="tools">
    <a href="https://www.md5hashgenerator.com/" target="_blank" rel="noopener">MD5 工具</a>
    <a href="https://www.devglan.com/online-tools/aes-encryption-decryption" target="_blank" rel="noopener">AES 解碼器</a>
  </div>
  <p class="note">
    提示：AES-128-CBC，密文前 16 bytes 是 IV。
  </p>
  <div class="footer">祝你好運。</div>
</div>
</body>
</html>
