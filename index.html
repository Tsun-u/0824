<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一封密信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--card:#1a1a1a;--text:#d4c5a9;--accent:#c8956c;
  --border:#3a3028;--hint:#8a7a60;--input-bg:#111;--input-border:#4a3a28;
  --success:#5a9a5a;--fail:#c05050;
}
body{
  background:var(--bg);color:var(--text);font-family:"Georgia","Times New Roman",serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.envelope{
  max-width:600px;width:100%;background:var(--card);
  border:1px solid var(--border);border-radius:4px;
  padding:40px 32px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.envelope::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.seal{
  width:60px;height:60px;margin:0 auto 24px;
  border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:0 4px 12px rgba(200,149,108,0.3);
}
h1{
  text-align:center;font-size:1.3em;font-weight:normal;
  letter-spacing:0.1em;margin-bottom:24px;color:var(--accent);
}
.divider{
  width:60px;height:1px;background:var(--border);margin:20px auto;
}
.cipher-block{
  background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:4px;padding:16px;margin:20px 0;
  font-family:"Courier New",monospace;font-size:0.85em;
  word-break:break-all;line-height:1.6;color:var(--hint);
  text-align:center;
}
.hint{
  font-size:0.9em;line-height:1.8;color:var(--hint);
  text-align:center;margin:20px 0;font-style:italic;
}
.hint strong{color:var(--text)}
.input-area{margin:24px 0;text-align:center}
.input-area label{
  display:block;font-size:0.85em;color:var(--hint);margin-bottom:8px;
}
.input-area input{
  width:100%;max-width:360px;padding:12px 16px;
  background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:4px;color:var(--text);font-size:1em;
  font-family:inherit;text-align:center;outline:none;
  transition:border-color 0.3s;
}
.input-area input:focus{border-color:var(--accent)}
.input-area input::placeholder{color:#555}
button{
  display:block;margin:16px auto 0;padding:10px 32px;
  background:transparent;border:1px solid var(--accent);
  color:var(--accent);font-family:inherit;font-size:0.95em;
  border-radius:4px;cursor:pointer;transition:all 0.3s;
  letter-spacing:0.05em;
}
button:hover{background:var(--accent);color:var(--bg)}
.msg{
  text-align:center;margin-top:16px;font-size:0.9em;
  min-height:1.4em;transition:color 0.3s;
}
.msg.ok{color:var(--success)}
.msg.fail{color:var(--fail)}
.footer{
  text-align:center;font-size:0.75em;color:#444;margin-top:32px;
  letter-spacing:0.05em;
}
</style>
</head>
<body>
<div class="envelope">
  <div class="seal">🔐</div>
  <h1>一封密信</h1>
  <div class="divider"></div>
  <p class="hint">
    這段文字被鎖住了。<br>
    打開它需要一把鑰匙。
  </p>
  <div class="cipher-block" id="cipher">dHN1bnU4MjRiaXJ0aGRheWXdQ9EZtuQNE903tctWWrUokClTvHiUW331md0KA0P8Lki3IRTDHkgBezDKfwdIxw==</div>
  <p class="hint">
    鑰匙藏在他的生活裡——<br>
    <strong>一個日期</strong>、<strong>兩個名字</strong>、<strong>一間公司</strong>。<br><br>
    把它們按順序串起來，<br>
    然後用 <strong>MD5</strong> 鑄成鑰匙。
  </p>
  <div class="divider"></div>
  <div class="input-area">
    <label>輸入你拼出的原始字串</label>
    <input type="text" id="keyInput" placeholder="日期＋名字＋名字＋公司" autocomplete="off">
  </div>
  <button onclick="tryDecrypt()">解鎖</button>
  <div class="msg" id="msg"></div>
  <div class="footer">AES-128-CBC · MD5 · 密文前 16 bytes 是 IV</div>
</div>

<script>
// MD5 implementation (RFC 1321)

593408605),a=l(a,b,c,d,f[e+10],9,38016083),d=l(d,a,b,c,f[e+15],14,3634488961),c=l(c,d,a,b,f[e+4],20,3889429448),b=l(b,c,d,a,f[e+9],5,568446438),a=l(a,b,c,d,f[e+14],9,3275163606),d=l(d,a,b,c,f[e+3],14,4107603335),c=l(c,d,a,b,f[e+8],20,1163531501),b=l(b,c,d,a,f[e+13],5,2850285829),a=l(a,b,c,d,f[e+2],9,4243563512),d=l(d,a,b,c,f[e+7],14,1735328473),c=l(c,d,a,b,f[e+12],20,2368359562),b=m(b,c,d,a,f[e+5],4,4294588738),a=m(a,b,c,d,f[e+8],11,2272392833),d=m(d,a,b,c,f[e+11],16,1839030562),c=m(c,d,a,b,f[e+14],23,4259657740),b=m(b,c,d,a,f[e+1],4,2763975236),a=m(a,b,c,d,f[e+4],11,1272893353),d=m(d,a,b,c,f[e+7],16,4139469664),c=m(c,d,a,b,f[e+10],23,3200236656),b=m(b,c,d,a,f[e+13],4,681279174),a=m(a,b,c,d,f[e],11,3936430074),d=m(d,a,b,c,f[e+3],16,3572445317),c=m(c,d,a,b,f[e+6],23,76029189),b=m(b,c,d,a,f[e+9],4,3654602809),a=m(a,b,c,d,f[e+12],11,3873151461),d=m(d,a,b,c,f[e+15],16,530742520),c=m(c,d,a,b,f[e+2],23,3299628645),b=n(b,c,d,a,f[e],6,4096336452),a=n(a,b,c,d,f[e+7],10,1126891415),d=n(d,a,b,c,f[e+14],15,2878612391),c=n(c,d,a,b,f[e+5],21,4237533241),b=n(b,c,d,a,f[e+12],6,1700485571),a=n(a,b,c,d,f[e+3],10,2399980690),d=n(d,a,b,c,f[e+10],15,4293915773),c=n(c,d,a,b,f[e+1],21,2240044497),b=n(b,c,d,a,f[e+8],6,1873313359),a=n(a,b,c,d,f[e+15],10,4264355552),d=n(d,a,b,c,f[e+6],15,2734768916),c=n(c,d,a,b,f[e+13],21,1309151649),b=n(b,c,d,a,f[e+4],6,4149444226),a=n(a,b,c,d,f[e+11],10,3174756917),d=n(d,a,b,c,f[e+2],15,718787259),c=n(c,d,a,b,f[e+9],21,3951481745),b=h(b,q),c=h(c,r),d=h(d,s),a=h(a,t);return(p(b)+p(c)+p(d)+p(a))}}();

// AES-128-CBC implementation
var AES=(function(){
var Sbox=[99,124,119,123,242,107,111,197,48,1,103,43,254,215,171,118,202,130,201,125,250,89,71,240,173,212,162,175,156,164,114,192,183,253,147,38,54,63,247,204,52,165,229,241,113,216,49,21,4,199,35,195,24,150,5,154,7,18,128,226,235,39,178,117,9,131,44,26,27,110,90,160,82,59,214,179,41,227,47,132,83,209,0,237,32,252,177,91,106,203,190,57,74,76,88,207,208,239,170,251,67,77,51,133,69,249,2,127,80,60,159,168,81,163,64,143,146,157,56,245,188,182,218,33,16,255,243,210,205,12,19,236,95,151,68,23,196,167,126,61,100,93,25,115,96,129,79,220,34,42,144,136,70,238,184,20,222,94,11,219,224,50,58,10,73,6,36,92,194,211,172,98,145,149,228,121,231,200,55,109,141,213,78,169,108,86,244,234,101,122,174,8,186,120,37,46,28,166,180,198,232,221,116,31,75,189,139,138,112,62,181,102,72,3,246,14,97,53,87,185,134,193,29,158,225,248,152,17,105,217,142,148,155,30,135,233,206,85,40,223,140,161,137,13,191,230,66,104,65,153,45,15,176,84,187,22];
var Rcon=[1,2,4,8,16,32,64,128,27,54];
function subBytes(s){for(var i=0;i<16;i++)s[i]=Sbox[s[i]]}
function shiftRows(s){var t=s[1];s[1]=s[5];s[5]=s[9];s[9]=s[13];s[13]=t;t=s[2];s[2]=s[10];s[10]=t;t=s[6];s[6]=s[14];s[14]=t;t=s[3];s[3]=s[15];s[15]=s[11];s[11]=s[7];s[7]=t}
function xtime(a){return a&128?a<<1^283:a<<1}
function mixCol(s,i){var a=s[i],b=s[i+1],c=s[i+2],d=s[i+3];var e=a^b^c^d;s[i]^=e^xtime(a^b);s[i+1]^=e^xtime(b^c);s[i+2]^=e^xtime(c^d);s[i+3]^=e^xtime(d^a)}
function mixColumns(s){for(var i=0;i<16;i+=4)mixCol(s,i)}

function invSubBytes(s){for(var i=0;i<16;i++)s[i]=InvSbox[s[i]]}
function invShiftRows(s){var t=s[13];s[13]=s[9];s[9]=s[5];s[5]=s[1];s[1]=t;t=s[2];s[2]=s[10];s[10]=t;t=s[6];s[6]=s[14];s[14]=t;t=s[3];s[3]=s[7];s[7]=s[11];s[11]=s[15];s[15]=t}

  decrypt:function(keyHex,dataB64){

})();

var CIPHER="dHN1bnU4MjRiaXJ0aGRheWXdQ9EZtuQNE903tctWWrUokClTvHiUW331md0KA0P8Lki3IRTDHkgBezDKfwdIxw==";

function tryDecrypt(){
  var input=document.getElementById("keyInput").value.trim();
  var msg=document.getElementById("msg");
  if(!input){msg.textContent="請輸入字串";msg.className="msg fail";return}
  var keyHex=MD5(input);
  try{
    var result=AES.decrypt(keyHex,CIPHER);
    if(result&&result.startsWith("http")){
      msg.textContent="解鎖成功！正在前往⋯";msg.className="msg ok";
      setTimeout(function(){window.location.href=result},1500);
    }else{
      msg.textContent="鑰匙不對，再想想。";msg.className="msg fail";
    }
  }catch(e){
    msg.textContent="鑰匙不對，再想想。";msg.className="msg fail";
  }
}
document.getElementById("keyInput").addEventListener("keydown",function(e){if(e.key==="Enter")tryDecrypt()});
</script>
</body>
</html>
